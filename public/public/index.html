<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tab Curriculum Sorter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: #f4f4f4;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 700px;
      margin: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    textarea {
      width: 100%;
      height: 220px;
      margin-top: 15px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    pre {
      background: #efefef;
      padding: 15px;
      overflow-x: auto;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Tab Curriculum Sorter</h1>

  <p>Paste curriculum counts below.</p>

  <textarea id="input"></textarea>

  <button onclick="processData()">Generate Packing Cards</button>

  <pre id="output"></pre>
</div>

<script>
function processData() {
  const input = document.getElementById('input').value;

  const lines = input
    .split('\n')
    .filter(line => line.trim() !== '');

  let result = '';

  lines.forEach((line, index) => {
    result += `ROOM ${index + 1}\n`;
    result += `${line}\n`;
    result += `-----------------------\n`;
  });

  document.getElementById('output').textContent = result;
}
</script>

</body>
</html>
